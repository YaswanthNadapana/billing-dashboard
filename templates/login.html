<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;

    background: linear-gradient(-45deg, #667eea, #764ba2, #43cea2, #185a9d);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* glass card */
.card {
    width: 520px;
    padding: 45px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    color: white;
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

/* floating labels */
.input-group {
    position: relative;
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    height: 50px;
    border-radius: 10px;
    border: none;
    padding: 14px;
    font-size: 16px;
}

.input-group label {
    position: absolute;
    left: 14px;
    top: 14px;
    color: #666;
    transition: 0.2s ease;
    background: white;
    padding: 0 6px;
    border-radius: 4px;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
    top: -8px;
    font-size: 12px;
    color: #333;
}

/* glowing button */
.btn-primary {
    height: 50px;
    font-size: 17px;
    font-weight: 500;
    border-radius: 10px;
    background: #ffffff;
    color: #333;
    border: none;
    transition: 0.3s ease;
}

.btn-primary:hover {
    box-shadow: 0 0 15px rgba(255,255,255,0.8);
    transform: translateY(-2px);
}

.btn-outline-light {
    border-radius: 10px;
    height: 50px;
}
</style>

</head>
<body>

<div class="card text-center">

    <h2 class="mb-4">🔐 Welcome Back</h2>

    {% if error %}
    <div class="alert alert-danger">{{error}}</div>
    {% endif %}

    <form method="POST">

        <div class="input-group">
            <input name="username" placeholder=" " required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" name="password" placeholder=" " required>
            <label>Password</label>
        </div>

        <div class="form-check text-start mb-3">
            <input class="form-check-input" type="checkbox" onclick="togglePassword()">
            <label class="form-check-label text-white">Show Password</label>
        </div>

        <button class="btn btn-primary w-100 mb-3">
            Login
        </button>

        <a href="/register" class="btn btn-outline-light w-100">
            Create Account
        </a>

    </form>

</div>

<script>
function togglePassword() {
    const pwd = document.getElementById("password");
    pwd.type = pwd.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
