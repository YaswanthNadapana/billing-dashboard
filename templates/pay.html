<!DOCTYPE html>

<html>
<head>
<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#111;
color:white;
text-align:center;
font-family:Segoe UI;
}

.qr-box{
background:#222;
padding:30px;
border-radius:12px;
display:inline-block;
}

.status{
font-size:18px;
color:orange;
margin-top:15px;
}
</style>

</head>

<body>

<div class="container mt-5">

<h2>Scan QR to Pay</h2>

<div class="qr-box">

<img src="/qr/{{bill_id}}" width="250">

<h3 class="mt-3">Amount: ₹{{bill.amount}}</h3>

<p class="status">
Payment is processing...
</p>

<p>After completing payment, verification will happen automatically.</p>

</div>

<br>

<a href="/" class="btn btn-light mt-3">Cancel Payment</a>

</div>

<script>

// simulate automatic verification
setTimeout(function(){

window.location.href="/process_payment/{{bill_id}}";

},7000);  // 7 seconds

</script>

</body>
</html>
