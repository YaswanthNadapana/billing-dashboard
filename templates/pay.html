<!DOCTYPE html>
<html>
<head>

<title>Pay Invoice</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{
background:#111;
color:white;
text-align:center;
font-family:Segoe UI;
}

.payment-box{
background:#222;
padding:40px;
border-radius:12px;
display:inline-block;
}

.amount{
font-size:28px;
color:#00ff9d;
}
</style>

</head>

<body>

<div class="container mt-5">

<h2>Invoice Payment</h2>

<div class="payment-box mt-4">

<h4>Invoice: {{bill.invoice}}</h4>

<h3 class="amount">₹{{bill.amount}}</h3>

<p class="text-warning">Secure payment powered by Razorpay</p>

<button id="payBtn" class="btn btn-success btn-lg mt-3">
Pay Now
</button>

<br><br>

<a href="/dashboard" class="btn btn-light">
Cancel
</a>

</div>

</div>


<script>

var options = {

"key": "YOUR_KEY_ID",

"amount": "{{bill.amount * 100}}",

"currency": "INR",

"name": "Billing Dashboard",

"description": "Invoice Payment",

"handler": function (response){

// after payment success redirect
window.location.href="/payment_success/{{bill_id}}";

},

"theme": {
"color": "#3399cc"
}

};

var rzp = new Razorpay(options);

document.getElementById("payBtn").onclick = function(e){

rzp.open();
e.preventDefault();

}

</script>

</body>
</html>
