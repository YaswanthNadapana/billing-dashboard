<!DOCTYPE html>
<html>
<head>
<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#111;
color:white;
text-align:center;
font-family:Segoe UI;
}
</style>

</head>

<body>

<div class="container mt-5">

<h2>Scan QR to Pay</h2>

<img src="/qr/{{bill_id}}" width="250">

<h3 class="mt-3">Amount: ₹{{bill.amount}}</h3>

<p class="text-warning">Payment is processing...</p>

<a href="/process_payment/{{bill_id}}" class="btn btn-success mt-3">
I have completed payment
</a>

<br><br>

<a href="/" class="btn btn-light">Cancel</a>

</div>

</body>
</html>
