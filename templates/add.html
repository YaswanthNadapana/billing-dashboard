<!DOCTYPE html>
<html>
<head>
<title>Add Bill</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
<div class="card p-4">
<h4>Add Bill</h4>

<form method="POST">
<input name="category" placeholder="Category" class="form-control mb-3" required>
<input name="amount" type="number" placeholder="Amount" class="form-control mb-3" required>
<label>Due Date</label>
<input name="due_date" type="date" class="form-control mb-3" required>

<button class="btn btn-primary">Add</button>
<a href="/" class="btn btn-secondary">Back</a>
</form>

</div>
</div>

</body>
</html>
